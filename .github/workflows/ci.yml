name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python for the resume PDF
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install reportlab==4.4.9

      - name: Generate the two-page resume from the website
        run: python scripts/build-resume.py

      - name: Check site
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Upload checked site for review
        uses: actions/upload-artifact@v4
        with:
          name: checked-site
          path: dist
          retention-days: 7
